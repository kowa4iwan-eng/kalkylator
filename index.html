<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Підрахунок готівки в касі</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="header">
    <div>
      <h1>💼 Підрахунок готівки в касі</h1>
      <p>Швидко. Зручно. Точно.</p>
    </div>

    <div class="clock">
      <div id="liveDate">--.--.----</div>
      <strong id="liveTime">--:--:--</strong>
      <small id="liveDay">---</small>
    </div>
  </header>

  <section class="card form-card">
    <label>
      Назва каси
      <input id="cashName" placeholder="Наприклад: Каса №1">
    </label>

    <label>
      Очікувана сума в касі
      <input id="expected" type="number" step="0.01" placeholder="Наприклад: 12500.50">
    </label>

    <label class="wide">
      Коментар
      <input id="comment" placeholder="Наприклад: вечірній перерахунок, ПІБ касира...">
    </label>
  </section>

  <section class="card">
    <h2>Купюри / гривні</h2>

    <div class="table">
      <div class="table-head">
        <div>Номінал</div>
        <div>Кількість</div>
        <div>Сума</div>
      </div>

      <div id="moneyRows"></div>
    </div>
  </section>

  <section class="card">
    <h2>Додатково</h2>

    <div class="table">
      <div id="extraRows"></div>
    </div>
  </section>

  <section class="summary">
    <div>
      <span>Очікувана сума</span>
      <strong id="expectedTotal">0,00 грн</strong>
    </div>

    <div>
      <span>Фактично пораховано</span>
      <strong class="green" id="actualTotal">0,00 грн</strong>
    </div>

    <div>
      <span>Різниця</span>
      <strong id="differenceTotal">0,00 грн</strong>
    </div>
  </section>

  <div class="actions">
    <button onclick="printReport()">🖨️ Друк</button>
    <button class="save" onclick="saveCount()">💾 Зберегти</button>
  </div>

  <section class="card">
    <h2>📁 Архів перерахунків</h2>

    <input id="searchHistory" class="search" placeholder="Пошук по даті, сумі, коментарю...">

    <div id="historyList" class="history"></div>
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
