<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Підрахунок готівки в касі</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="visitor-counter" title="Унікальні відвідувачі сайту">
  👁 <span id="visitorCounter">—</span>
</div>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="brand-icon">₴</div>
      <div>
        <h1>Підрахунок готівки в касі</h1>
        <p>Швидко. Зручно. Точно. Київський час.</p>
      </div>
    </div>

    <div class="clock">
      <div class="clock-label">Київський час</div>
      <div id="liveDate">--.--.----</div>
      <strong id="liveTime">--:--:--</strong>
      <small id="liveDay">---</small>
    </div>
  </header>

  <section class="card form-card">
    <label>
      Назва каси
      <input id="cashName" placeholder="Наприклад: Каса №1">
    </label>

    <label>
      Очікувана сума в касі
      <input id="expected" type="text" inputmode="decimal" placeholder="Наприклад: 12500,50">
    </label>

    <label class="wide">
      Коментар
      <input id="comment" placeholder="Наприклад: вечірній перерахунок, ПІБ касира...">
    </label>
  </section>

  <section class="card">
    <div class="section-title">
      <h2>Купюри та монети</h2>
      <span>гривня ₴</span>
    </div>

    <div class="table">
      <div class="table-head">
        <div>Номінал</div>
        <div>Кількість</div>
        <div>Сума</div>
      </div>

      <div id="moneyRows"></div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      <h2>Додатково</h2>
      <span>додається до каси</span>
    </div>

    <div class="table">
      <div id="extraRows"></div>
    </div>
  </section>

  <section class="summary">
    <div>
      <span>Очікувана сума</span>
      <strong id="expectedTotal">0,00 грн</strong>
    </div>

    <div>
      <span>Фактично пораховано</span>
      <strong class="green" id="actualTotal">0,00 грн</strong>
    </div>

    <div>
      <span>Різниця</span>
      <strong id="differenceTotal">0,00 грн</strong>
    </div>
  </section>

  <div class="actions">
    <button onclick="printReport()">🖨️ Друк / PDF</button>
    <button class="clear" onclick="clearForm()">🧹 Очистити</button>
    <button class="save" onclick="saveCount()">💾 Зберегти</button>
  </div>

  <section class="card">
    <div class="section-title">
      <h2>📁 Архів перерахунків</h2>
      <span>останні 30</span>
    </div>

    <input id="searchHistory" class="search" placeholder="Пошук по даті, сумі, коментарю...">

    <div id="historyList" class="history"></div>
  </section>

</div>

<div id="printArea"></div>

<script src="script.js"></script>
</body>
</html>
